name: Update calendar availability notice

on:
  push:
    paths:
      - '.github/workflows/add-calendar-status.yml'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update missing calendar notice
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('No_School_Viewer.html')
          text = path.read_text(encoding='utf-8')

          replacement = '''    <section id="calendar-availability" class="calendar-availability panel p-4" aria-labelledby="calendar-availability-heading">
      <h2 id="calendar-availability-heading">Calendars Not Yet Publicly Available</h2>
      <p class="calendar-availability-intro">We are actively tracking 2026–27 school calendars across Genesee County. The schools below do not currently have a complete 2026–27 calendar publicly posted on their website. Where possible, we are using official event feeds, district announcements, and the Genesee County Common Calendar until a full school calendar becomes available.</p>
      <ul class="calendar-availability-list">
        <li class="calendar-availability-item">
          <strong>Genesee Jr/Sr High School</strong>
          <span class="calendar-availability-status">Partial official calendar available; later 2026–27 dates have not yet been published.</span>
        </li>
        <li class="calendar-availability-item">
          <strong>Genesee Early College</strong>
          <span class="calendar-availability-status">Official calendar is available, but a complete 2026–27 school-year schedule has not yet been published.</span>
        </li>
      </ul>
      <p class="calendar-availability-help"><strong>Know of a calendar we missed?</strong> If your school has published an official 2026–27 calendar that is not listed here, please send us the link so we can verify and update the schedule.</p>
    </section>'''

          pattern = r'    <section id="calendar-availability".*?</section>'
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not uniquely locate calendar availability section')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit page update
        shell: bash
        run: |
          if git diff --quiet -- No_School_Viewer.html; then
            echo "No page changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add No_School_Viewer.html
          git commit -m "Narrow missing calendar list to Genesee schools"
          git push
